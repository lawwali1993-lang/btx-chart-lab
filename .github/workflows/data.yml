name: Update market data

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Symbol (XAUUSD, XAGUSD, EURUSD, GBPUSD, BTCUSD)'
        default: 'XAUUSD'
      from:
        description: 'From month (YYYY-MM)'
        default: '2024-01'
  push:
    branches: [main]
    paths: ['tools/duka.mjs', 'tools/fetch-month.mjs', 'tools/data-plan.mjs', 'tools/merge-data.mjs', '.github/workflows/data.yml']
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

env:
  SYMBOL: ${{ github.event.inputs.symbol || 'XAUUSD' }}
  FROM: ${{ github.event.inputs.from || '2024-01' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.p.outputs.months }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i lzma@2.3.2 --no-save --no-package-lock
      - id: p
        run: echo "months=$(node tools/data-plan.mjs $SYMBOL $FROM)" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    if: needs.plan.outputs.months != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        month: ${{ fromJSON(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i lzma@2.3.2 --no-save --no-package-lock
      - name: Fetch month
        timeout-minutes: 50
        run: node tools/fetch-month.mjs $SYMBOL ${{ matrix.month }} chunk/${SYMBOL}_${{ matrix.month }}.btxd
      - name: Push chunk branch
        if: always()
        run: |
          [ -f chunk/${SYMBOL}_${{ matrix.month }}.btxd ] || { echo "no chunk"; exit 0; }
          mkdir /tmp/c && cp chunk/*.btxd /tmp/c/ && cd /tmp/c
          git init -q && git checkout -q -b chunk-${SYMBOL}-${{ matrix.month }}
          git config user.name "btx-data-bot"; git config user.email "btx-data-bot@users.noreply.github.com"
          git add . && git commit -q -m "chunk ${{ matrix.month }}"
          for i in 1 2 3 4 5; do git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD && break || sleep $((i*3)); done

  merge:
    needs: [plan, fetch]
    if: always() && needs.plan.outputs.months != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i lzma@2.3.2 --no-save --no-package-lock
      - name: Collect chunks
        run: |
          mkdir -p chunks
          for b in $(git ls-remote --heads origin "chunk-${SYMBOL}-*" | awk '{print $2}' | sed 's#refs/heads/##'); do
            git fetch -q --depth 1 origin "$b:refs/remotes/origin/$b" && git --work-tree=chunks checkout "origin/$b" -- . && echo "got $b"
          done
          git reset -q
          ls -la chunks
      - name: Merge
        run: node tools/merge-data.mjs $SYMBOL chunks
      - name: Commit data
        run: |
          git config user.name "btx-data-bot"
          git config user.email "btx-data-bot@users.noreply.github.com"
          git add data/*.btxd data/*.json
          git commit -m "data: $SYMBOL update $(date -u +%F)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
      - name: Delete chunk branches
        run: |
          for b in $(git ls-remote --heads origin "chunk-${SYMBOL}-*" | awk '{print $2}' | sed 's#refs/heads/##'); do git push -q origin --delete "$b" || true; done
