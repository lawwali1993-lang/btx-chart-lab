name: Probe data sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          for u in \
            "https://datafeed.dukascopy.com/datafeed/XAUUSD/2024/00/02/BID_candles_min_1.bi5" \
            "https://datafeed.dukascopy.com/datafeed/XAUUSD/2026/10/20/BID_candles_min_1.bi5" \
            "https://datafeed.dukascopy.com/datafeed/XAUUSD/2024/00/02/10h_ticks.bi5" \
            "https://jetta.dukascopy.com/v1/candles/minute/XAU-USD/BID/2024/1/3" \
            "https://data.binance.vision/data/spot/monthly/klines/PAXGUSDT/1m/PAXGUSDT-1m-2024-01.zip" \
            "https://candledata.fxcorporate.com/m1/XAUUSD/2024/1.csv.gz" \
            "https://candledata.fxcorporate.com/m1/EURUSD/2024/1.csv.gz" \
            "https://www.histdata.com/download-free-forex-historical-data/?/ascii/1-minute-bar-quotes/xauusd/2024" \
            "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=1m&range=5d" ; do
            code=$(curl -s -L -A "$UA" -o /tmp/out.bin -w "%{http_code} %{size_download}" --max-time 40 "$u")
            echo "$code $u" | tee -a probe.txt
            head -c 120 /tmp/out.bin | xxd | head -3 >> probe.txt
          done
      - name: Save
        if: always()
        run: |
          git config user.name "btx-data-bot"; git config user.email "btx-data-bot@users.noreply.github.com"
          cp probe.txt /tmp/probe.txt || echo none > /tmp/probe.txt
          git fetch origin ci-logs || true
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp /tmp/probe.txt probe.txt; git add probe.txt; git commit -m "probe" || true; git push -f origin ci-logs
