<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#131722">
<title>BTX Chart Lab</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="theme-dark">
<div id="app">
  <header id="top">
    <button id="btnMenu" class="ib" title="القائمة"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <button id="btnSymbol" class="pill sym" title="الرمز">—</button>
    <button id="btnTf" class="pill tf" title="الإطار الزمني">1m</button>
    <button id="btnType" class="ib" title="نوع الشارت"><svg viewBox="0 0 24 24"><path d="M7 3v4M7 17v4M17 3v6M17 19v2"/><rect x="5" y="7" width="4" height="10"/><rect x="15" y="9" width="4" height="10"/></svg></button>
    <button id="btnInd" class="ib" title="المؤشرات"><b class="fx">ƒx</b></button>
    <button id="btnReplay" class="ib" title="إعادة التشغيل (Replay)"><svg viewBox="0 0 24 24"><path d="M11 6 4 12l7 6V6zM20 6l-7 6 7 6V6z"/></svg></button>
    <button id="btnTrade" class="ib" title="التداول التدريبي"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 15l4-4 3 3 5-6"/><path d="M15 8h4v4"/></svg></button>
    <span class="spacer"></span>
    <button id="btnTools" class="ib" title="أدوات الرسم"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg></button>
    <button id="btnSettings" class="ib" title="الإعدادات"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  </header>
  <div id="mid">
    <nav id="tools"></nav>
    <div id="chartBox">
      <div id="chart"></div>
      <div id="replayBar" class="floatbar hidden"></div>
      <div id="tradeBar" class="hidden"></div>
      <div id="drawPop" class="floatbar hidden"></div>
      <div id="busy" class="hidden"><div class="spin"></div><span id="busyText">...</span></div>
    </div>
  </div>
  <section id="panel" class="collapsed">
    <div id="tabs">
      <div class="grip"></div>
      <button data-tab="editor">محرر Pine</button>
      <button data-tab="tester">مختبر الاستراتيجية</button>
      <button data-tab="trade">التداول</button>
      <button data-tab="log">السجل</button>
      <span class="spacer"></span>
      <button id="panelMax" class="ib sm" title="تكبير">⤢</button>
      <button id="panelClose" class="ib sm" title="إغلاق">▾</button>
    </div>
    <div id="panelBody">
      <div class="tabc" id="tab-editor"></div>
      <div class="tabc" id="tab-tester"></div>
      <div class="tabc" id="tab-trade"></div>
      <div class="tabc" id="tab-log"></div>
    </div>
  </section>
</div>
<div id="sheetLayer"></div>
<div id="toast"></div>
<input type="file" id="fileInput" class="hidden">
<script src="js/build.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
